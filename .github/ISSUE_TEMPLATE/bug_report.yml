name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A runnable reproduction gets a fix far faster
        than a description — a StackBlitz or CodeSandbox link is ideal.

  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "1.2.0"
    validations:
      required: true

  - type: dropdown
    id: react-version
    attributes:
      label: React version
      options: ["19.x", "18.x", "17.x", "other"]
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Vite
        - Next.js (App Router)
        - Next.js (Pages Router)
        - Create React App
        - Remix
        - Jest / Vitest
        - Other
    validations:
      required: true

  - type: dropdown
    id: api
    attributes:
      label: Which API?
      options:
        - Children (<FormWizard.TabContent>)
        - Schema (schema prop)
        - Headless (useWizard)
        - Validation adapters
        - Styling / theming
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the full error message and stack trace if there is one.
    validations:
      required: true

  - type: input
    id: reproduction
    attributes:
      label: Reproduction link
      description: StackBlitz, CodeSandbox, or a minimal repository.

  - type: textarea
    id: code
    attributes:
      label: Relevant code
      render: tsx
